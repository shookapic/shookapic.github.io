    <!-- Resolve the theme before first paint, otherwise dark-mode visitors get
         a flash of the cream page while React boots. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'dark' ? '#14140f' : '#f5f1e4')
        } catch (e) {}
      })()
    </script>
